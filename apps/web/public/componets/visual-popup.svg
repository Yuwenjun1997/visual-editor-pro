<svg viewBox="0 0 1024 1024" width="48" height="48" xmlns="http://www.w3.org/2000/svg">
  <!-- 页面底色 -->
  <rect x="120" y="120" width="784" height="784" rx="64" fill="#eef2ff"/>
  <!-- 全屏遮罩 scrim -->
  <rect x="120" y="120" width="784" height="784" rx="64" fill="rgba(15,18,40,0.45)"/>
  <!-- 弹窗卡片（居中，渐变） -->
  <rect x="192" y="280" width="640" height="464" rx="40" fill="url(#p)"/>
  <defs>
    <linearGradient id="p" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#35407d"/>
      <stop offset="1" stop-color="#7b8cff"/>
    </linearGradient>
  </defs>
  <!-- 标题条 -->
  <rect x="336" y="344" width="352" height="40" rx="20" fill="#ffffff"/>
  <!-- 副标题条 -->
  <rect x="394" y="412" width="236" height="24" rx="12" fill="rgba(255,255,255,0.7)"/>
  <!-- 行动按钮（白色胶囊 + 蓝字） -->
  <rect x="372" y="608" width="280" height="80" rx="40" fill="#ffffff"/>
  <text x="512" y="661" font-size="40" font-family="Arial, sans-serif" font-weight="bold" fill="#4f6ef7" text-anchor="middle">立即领取</text>
  <!-- 关闭按钮（卡片右上角，白色圆 + X） -->
  <circle cx="770" cy="322" r="38" fill="rgba(255,255,255,0.92)"/>
  <path d="M754 306L786 338M786 306L754 338" stroke="#4f6ef7" stroke-width="14" stroke-linecap="round"/>
</svg>