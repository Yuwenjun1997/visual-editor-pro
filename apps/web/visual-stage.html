<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>编辑器舞台</title>
    <style>
      html,
      body {
        width: 100%;
        margin: 0;
        box-sizing: border-box;
      }

      html {
        scrollbar-width: thin;
        scrollbar-color: var(--el-border-color) transparent;
      }

      html::-webkit-scrollbar,
      body::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }

      html::-webkit-scrollbar-track,
      body::-webkit-scrollbar-track {
        background: transparent;
      }

      html::-webkit-scrollbar-thumb,
      body::-webkit-scrollbar-thumb {
        border: 1px solid transparent;
        border-radius: 999px;
        background-color: color-mix(in srgb, var(--el-text-color-secondary) 45%, transparent);
        background-clip: padding-box;
      }

      html::-webkit-scrollbar-thumb:hover,
      body::-webkit-scrollbar-thumb:hover {
        background-color: color-mix(in srgb, var(--el-text-color-secondary) 70%, transparent);
      }
    </style>
  </head>
  <body>
    <div id="app" style="user-select: none"></div>
    <script type="module" src="/src/editor-stage-main.ts"></script>
  </body>
</html>
